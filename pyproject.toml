[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parcel"
version = "0.2.0"
description = "A fast, simple, packages-only GUI for dnf on Fedora"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Izzy Rodriguez", email = "yzraeu@gmail.com" }]
dependencies = ["PyGObject >= 3.50"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Software Distribution",
]

[project.urls]
Homepage = "https://github.com/yzraeu/parcel"

[project.scripts]
parcel = "parcel.app:main"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["parcel", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["parcel"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
